<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Juice Shop</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #17301f;
    }
    body {
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, Arial, sans-serif;
    }
    svg {
      width: min(88vw, 500px);
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg" aria-label="Juice Shop icon">
    <rect width="192" height="192" fill="#17301f"/>
    <circle cx="96" cy="96" r="68" fill="#f2a516"/>
    <g stroke="#d8981c" stroke-width="5" stroke-linecap="round">
      <line x1="96" y1="28" x2="96" y2="54"/>
      <line x1="96" y1="138" x2="96" y2="164"/>
      <line x1="28" y1="96" x2="54" y2="96"/>
      <line x1="138" y1="96" x2="164" y2="96"/>
      <line x1="44" y1="44" x2="66" y2="66"/>
      <line x1="126" y1="126" x2="148" y2="148"/>
      <line x1="44" y1="148" x2="66" y2="126"/>
      <line x1="126" y1="66" x2="148" y2="44"/>
    </g>
    <circle cx="96" cy="96" r="8" fill="#b0243f"/>
  </svg>
</body>
</html>
